rules:
  github-app:
    ignore:
      # The bot edits PRs and issues across every repo in REPOS_LIST, so the
      # token is installation-wide by design.
      - project_sync.yaml
  cache-poisoning:
    ignore:
      # AWS CLI installer zip only, and PR-scoped caches are not visible to
      # the default branch.
      - docker.yaml
      - release.yml
  archived-uses:
    ignore:
      # actions/create-release is archived but pinned to a SHA; replacing it
      # means reworking the upload_url handoff to the asset upload step.
      - release.yml
