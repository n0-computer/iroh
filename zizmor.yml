rules:
  github-app:
    ignore:
      # Permissions are scoped; the install stays owner-wide because the bot
      # sweeps every repo in REPOS_LIST and an explicit list breaks the run as
      # soon as one of them lacks the app.
      - project_sync.yaml
  cache-poisoning:
    ignore:
      # AWS CLI installer zip only, and PR-scoped caches are not visible to
      # the default branch.
      - docker.yaml
      - release.yml
  archived-uses:
    ignore:
      # actions/create-release is archived but pinned to a SHA; replacing it
      # means reworking the upload_url handoff to the asset upload step.
      - release.yml
