[bans]
multiple-versions = "allow"
deny = ["native-tls", "openssl"]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",                        # BOSL license
    "CDLA-Permissive-2.0",            # Community Data License Agreement Permissive 2.0 due to webpki-root-certs
    "ISC",
    "MIT",
    "Zlib",
    "MPL-2.0",                        # https://fossa.com/blog/open-source-software-licenses-101-mozilla-public-license-2-0/
    "Unicode-3.0",
    "Unlicense",                      # https://unlicense.org/
]


[advisories]
# Explicit rather than load-bearing: `warn` is the default and the deny job
# already passes -Dwarnings. Note this is not a defence against how the
# 2026-08-20 arrayref attack was staged -- yanking every good version so that
# fresh resolves move onto the malicious upload. Refusing yanked crates does
# not help there; the committed lock files are what pin us off that path. All
# this buys is a hard failure in the deny job instead of a warning to spot in
# the log.
yanked = "deny"
ignore = [
  "RUSTSEC-2024-0436", # paste -> netlink-packet-core
  "RUSTSEC-2023-0089", # unmaintained: postcard -> heapless -> atomic-polyfill
  "RUSTSEC-2026-0194", # netwatch -> netdev -> plist -> quick-xml: remove once https://github.com/ebarnard/rust-plist/pull/191 is released
  "RUSTSEC-2026-0195", # netwatch -> netdev -> plist -> quick-xml: remove once https://github.com/ebarnard/rust-plist/pull/191 is released
]

[sources]
allow-git = []
